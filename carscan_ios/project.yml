name: CarScan
options:
  bundleIdPrefix: com.carscan
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"

targets:
  CarScanCore:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/CarScanCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.carscan.CarScanCore
      DEFINES_MODULE: YES

  CarScanApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/CarScanApp
    dependencies:
      - target: CarScanCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "CarScan Lite"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "CarScan Lite requires Bluetooth access to connect to wireless ELM327 and vLinker BLE OBD-II adapters."
        NSBluetoothPeripheralUsageDescription: "CarScan Lite uses Bluetooth to communicate with vehicle diagnostic adapters."
        NSLocalNetworkUsageDescription: "CarScan Lite requires Local Network access to connect to Wi-Fi OBD-II adapters (TCP 192.168.0.10:35000)."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - "arm64"
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.carscan.lite
      INFOPLIST_FILE: Info.plist
      TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CarScanCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CarScanCoreTests
    dependencies:
      - target: CarScanCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.carscan.CarScanCoreTests
